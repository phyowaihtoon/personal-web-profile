name: personal-web-profile
region: sgp

services:
  - name: api
    github:
      repo: phyowaihtoon/personal-web-profile
      branch: main
      deploy_on_push: true
    source_dir: backend-app
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    build_command: npm ci && npm run deploy:build
    run_command: npm run start
    routes:
      - path: /api
    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "4000"
        scope: RUN_TIME
      - key: CORS_ORIGIN
        value: https://your-app.ondigitalocean.app
        scope: RUN_TIME
      - key: DATABASE_URL
        value: file:./prisma/dev.db
        scope: RUN_AND_BUILD_TIME
      - key: JWT_ACCESS_SECRET
        value: REPLACE_WITH_LONG_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: JWT_REFRESH_SECRET
        value: REPLACE_WITH_LONG_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: COOKIE_SECURE
        value: "true"
        scope: RUN_TIME

static_sites:
  - name: web
    github:
      repo: phyowaihtoon/personal-web-profile
      branch: main
      deploy_on_push: true
    source_dir: frontend-app
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE_URL
        value: /api/v1
        scope: BUILD_TIME
